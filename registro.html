<!DOCTYPE html>
<html lang="es">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Registro | Proyecto Fénix</title>
	<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-white min-h-screen flex items-center justify-center p-4">

	<form id="registerForm" class="w-full max-w-sm bg-white p-6 sm:p-8 rounded-xl shadow-lg
               border border-gray-200">

		<h1 class="text-xl sm:text-2xl font-bold text-center text-gray-900 mb-6">
			Crear cuenta
		</h1>

		<!-- Email -->
		<div class="mb-4">
			<label class="block text-xs sm:text-sm text-gray-700 mb-2">Email</label>
			<input type="email" required class="w-full px-3 py-2 sm:py-3 text-sm sm:text-base rounded-md bg-white text-gray-900
                    border border-gray-300 focus:ring-2
                    focus:ring-orange-400 outline-none">
		</div>

		<!-- Password -->
		<div class="mb-6">
			<label class="block text-xs sm:text-sm text-gray-700 mb-2">Contraseña</label>
			<input type="password" minlength="6" required class="w-full px-3 py-2 sm:py-3 text-sm sm:text-base rounded-md bg-white text-gray-900
                    border border-gray-300 focus:ring-2
                    focus:ring-orange-400 outline-none">
		</div>

		<!-- Error -->
		<p id="registerError" class="hidden text-xs sm:text-sm text-red-500 mb-4"></p>

		<!-- Button -->
		<button type="submit"
			class="w-full py-2 sm:py-3 text-sm sm:text-base rounded-md font-semibold bg-orange-500 hover:bg-orange-600 transition text-white">
			Registrarse
		</button>

		<!-- Link -->
		<p class="text-xs sm:text-sm text-center text-gray-600 mt-4">
			¿Ya tienes cuenta?
			<a href="login.html" class="text-orange-500 hover:underline">
				Inicia sesión
			</a>
		</p>

	</form>

	<!-- Scripts -->
	<script type="module" src="./js/register.js"></script>
</body>

</html>
