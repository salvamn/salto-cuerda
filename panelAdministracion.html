<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Cambio - Panel de Administración</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script type="module" src="./js/firebase.js"></script>
    <script type="module" src="./js/auth.js"></script>
    <script type="module" src="./js/sessions.js"></script>
    <script type="module" src="./js/main.js"></script>


    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        principal: '#f97316'
                    }
                }
            }
        }
    </script>
</head>

<body class="min-h-screen">


    <nav class="relative flex items-center justify-center px-5 py-2 w-full bg-black overflow-hidden">
        <!-- Fondo fuego animado (sutil) -->
        <div class="absolute inset-0 bg-gradient-to-r from-transparent via-phoenix-500/10 to-transparent"></div>

        <!-- Línea inferior fuego -->
        <div
            class="absolute bottom-0 left-0 w-full h-[2px] bg-gradient-to-r from-transparent via-phoenix-400 to-transparent">
        </div>

        <!-- Logo -->
        <img src="./assets/logo-minino.png" alt="Proyecto Fénix"
            class="relative h-8 w-auto drop-shadow-[0_0_15px_rgba(255,90,0,0.45)]" />
    </nav>


    <div id="publicLinks"
        class="hidden relative flex items-center justify-center px-5 w-full overflow-hidden border border-bottom border-gray-200 shadow-sm">
        <div class="w-full bg-charcoal border-b border-phoenix-400/20">
            <div class="max-w-6xl mx-auto flex items-center justify-end space-x-2 px-2 py-2 text-sm">

                <a href="./login.html" class="text-gray-500 font-bold">iniciar sesión</a>
                <a href="./registro.html" class="text-gray-500 font-bold">registro</a>
                <!-- <span class="italic text-gray-400">
                    
                </span> -->

            </div>
        </div>
    </div>

    <!-- Links privados -->
    <div id="privateLinks"
        class="hidden relative flex items-center justify-center px-5 w-full overflow-hidden border border-bottom border-gray-200 shadow-sm bg-gray-50 py-3 space-x-4">
        <a href="index.html" class="text-steel-300 hover:text-phoenix-400">
            Inicio
        </a>
        <a href="perfil.html">Perfil</a>
        <button id="logoutBtn" class="text-ember-500 hover:text-ember-400">
            Salir
        </button>
    </div>

    <!-- <div class="m-4 flex flex-col">
        <a href="./modules/cuerda/contadorSaltos.html" class="text-blue-500">Contador de Saltos</a>
        <a href="./modules/cuerda/temporizador.html" class="text-blue-500">Temporizador</a>
    </div> -->

    <!-- Calendar Section -->
    <section class="px-4 py-8 bg-gradient-to-b from-gray-50 to-white">
        <div class="max-w-6xl mx-auto">
            <!-- Header con navegación de meses -->
            <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
                <div class="flex items-center justify-between mb-6">
                    <button id="prevMonth"
                        class="bg-orange-500 hover:bg-orange-600 text-white p-2 rounded-lg transition transform hover:scale-105">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7">
                            </path>
                        </svg>
                    </button>
                    <div class="text-center">
                        <h2 id="monthYear" class="text-2xl md:text-3xl font-bold text-gray-900"></h2>
                        <p class="text-gray-500 text-sm mt-1">Seguimiento de tus entrenamientos</p>
                    </div>
                    <button id="nextMonth"
                        class="bg-orange-500 hover:bg-orange-600 text-white p-2 rounded-lg transition transform hover:scale-105">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7">
                            </path>
                        </svg>
                    </button>
                </div>

                <!-- Días de la semana -->
                <div class="grid grid-cols-7 gap-2 md:gap-3 mb-4">
                    <div class="text-center font-bold text-gray-600 py-2 text-sm md:text-base">Lun</div>
                    <div class="text-center font-bold text-gray-600 py-2 text-sm md:text-base">Mar</div>
                    <div class="text-center font-bold text-gray-600 py-2 text-sm md:text-base">Mié</div>
                    <div class="text-center font-bold text-gray-600 py-2 text-sm md:text-base">Jue</div>
                    <div class="text-center font-bold text-gray-600 py-2 text-sm md:text-base">Vie</div>
                    <div class="text-center font-bold text-gray-600 py-2 text-sm md:text-base">Sáb</div>
                    <div class="text-center font-bold text-gray-600 py-2 text-sm md:text-base">Dom</div>
                </div>

                <!-- Calendario -->
                <div id="calendar" class="grid grid-cols-7 gap-2 md:gap-3"></div>
            </div>

            <!-- Leyenda -->
            <div class="bg-white rounded-lg shadow p-4">
                <h3 class="font-bold text-gray-900 mb-3">Leyenda</h3>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <div class="flex items-center gap-2">
                        <div class="w-4 h-4 bg-gray-200 rounded"></div>
                        <span class="text-sm text-gray-600">Sin datos</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <div class="w-4 h-4 bg-green-100 border-2 border-green-300 rounded"></div>
                        <span class="text-sm text-gray-600">Entrenó</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <div class="w-4 h-4 bg-red-100 border-2 border-red-300 rounded"></div>
                        <span class="text-sm text-gray-600">No entrenó</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <div class="w-4 h-4 bg-gray-400 rounded"></div>
                        <span class="text-sm text-gray-600">Otro mes</span>
                    </div>
                </div>
            </div>
        </div>
    </section>



</body>




</html>




<script type="module" src="./js/components/nav.js"></script>
<script type="module" src="./js/components/calendario.js"></script>



</script>
