<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Proyecto Fénix</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-white min-h-screen flex items-center justify-center p-4">

    <form id="loginForm" class="w-full max-w-sm bg-white p-6 sm:p-8 rounded-xl shadow-lg border border-gray-200">

        <h1 class="text-xl sm:text-2xl font-bold text-gray-900 text-center mb-6">
            Iniciar sesión
        </h1>

        <input type="email" id="email" placeholder="Email" required
            class="w-full mb-4 px-3 py-2 sm:py-3 text-sm sm:text-base rounded-md bg-white text-gray-900 border border-gray-300 focus:ring-2 focus:ring-orange-400 outline-none">

        <input type="password" id="password" placeholder="Contraseña" required
            class="w-full mb-6 px-3 py-2 sm:py-3 text-sm sm:text-base rounded-md bg-white text-gray-900 border border-gray-300 focus:ring-2 focus:ring-orange-400 outline-none">

        <p id="error" class="hidden text-red-500 text-xs sm:text-sm mb-4"></p>

        <button type="submit"
            class="w-full bg-orange-500 hover:bg-orange-600 text-white py-2 sm:py-3 text-sm sm:text-base rounded-md font-semibold transition">
            Entrar
        </button>

    </form>

    <!-- JS del login -->
    <script type="module" src="./js/login.js"></script>

</body>

</html>
